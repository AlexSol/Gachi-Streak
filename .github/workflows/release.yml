# Push a tag to release the Windows client:
#   git tag v0.3.0 && git push origin v0.3.0
# Servers pick the release up within 15 minutes and clients announce it.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build gachi-client.exe
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p bin
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.version=$VERSION" \
            -o bin/gachi-client.exe ./cmd/client
          cd bin && sha256sum gachi-client.exe > checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/gachi-client.exe bin/checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
