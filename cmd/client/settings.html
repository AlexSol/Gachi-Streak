<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Налаштування</title>
<style>
  /*@themes*/
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font: 13.5px/1.45 var(--font);
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .tape { height: 5px; background: repeating-linear-gradient(-45deg, var(--accent) 0 9px, var(--stripe) 9px 18px); }

  .top { display: flex; align-items: baseline; gap: 10px; padding: 14px 22px 12px; border-bottom: 1px solid var(--line); }
  .top h1 { margin: 0; font-size: 17px; font-weight: 800; }
  .top h1 span { color: var(--accent); }
  .top .ver { color: var(--muted); font-size: 12px; }

  .body { display: grid; grid-template-columns: 170px 1fr; min-height: 0; }
  nav { padding: 14px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  nav a {
    display: block; padding: 7px 10px; border-radius: 7px; color: var(--muted); text-decoration: none; cursor: pointer;
  }
  nav a:hover { background: var(--hover); color: var(--text); }
  nav a.on { background: var(--panel); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
  main { overflow-y: auto; padding: 6px 22px 28px; scroll-behavior: smooth; }

  section { padding-top: 18px; }
  section h2 { margin: 0 0 10px; font-size: 14px; font-weight: 800; letter-spacing: .2px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .row {
    display: grid; grid-template-columns: 190px 1fr; gap: 14px; align-items: center;
    padding: 11px 14px; border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row > label:first-child { color: var(--text); }
  .row small, .hint { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row.top-align { align-items: start; }

  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input[type=number] { width: 110px; }
  textarea { min-height: 62px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
  .with-btn { display: flex; gap: 6px; }
  .with-btn input { flex: 1; min-width: 0; }

  .btn {
    border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .btn.primary:disabled { opacity: .45; cursor: default; }

  /* switch */
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .switch i { position: absolute; inset: 0; border-radius: 11px; background: var(--line); transition: background .15s; pointer-events: none; }
  .switch i::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--text); transition: transform .15s;
  }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(16px); background: var(--on-accent); }
  .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* segmented */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg label { padding: 6px 12px; cursor: pointer; color: var(--muted); }
  .seg input { display: none; }
  .seg input:checked + span { color: var(--text); }
  .seg label:has(input:checked) { background: var(--bg); box-shadow: inset 0 -2px 0 var(--accent); color: var(--text); }

  /* theme chips: each chip renders in its own theme */
  .themes { display: flex; flex-wrap: wrap; gap: 8px; }
  .theme {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .theme .sw { width: 26px; height: 18px; border-radius: 4px; background: linear-gradient(135deg, var(--accent) 0 50%, var(--panel) 50%); border: 1px solid var(--line); }
  .theme.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .theme input { display: none; }

  /* background gallery */
  .state { padding: 12px 14px; border-top: 1px solid var(--line); }
  .state:first-child { border-top: 0; }
  .state-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .state-head b { font-weight: 700; }
  .state-head .hint { margin: 0; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .tile {
    flex: none; width: 112px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    cursor: pointer; padding: 0; text-align: left; overflow: hidden; position: relative;
  }
  .tile:hover { border-color: var(--muted); }
  .tile.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .tile.on::after {
    content: "✓"; position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); color: var(--on-accent); font: 700 11px/18px var(--font); text-align: center;
  }
  .tile .pv {
    height: 70px; display: grid; place-items: center; background: var(--panel); font-size: 22px; color: var(--muted); overflow: hidden;
  }
  .tile .pv img, .tile .pv video { width: 112px; height: 70px; object-fit: cover; display: block; }
  .tile .cap { display: block; padding: 5px 7px; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dim { display: flex; align-items: center; gap: 10px; }
  .dim input { flex: 1; accent-color: var(--accent); }
  .dim output { width: 40px; text-align: right; font-family: var(--mono); color: var(--muted); }

  .bar {
    display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--panel);
  }
  .bar .msg { flex: 1; color: var(--muted); font-size: 12.5px; }
  .bar .msg.err { color: var(--fail); }
  .bar .msg.ok { color: var(--safe); }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  .link:hover { color: var(--text); }
</style>
</head>
<body>
<div>
  <div class="tape"></div>
  <div class="top"><h1><span>♂</span> Налаштування</h1><span class="ver" id="ver"></span></div>
</div>

<div class="body">
  <nav id="nav">
    <a data-to="s-widget">🪟 Віджет</a>
    <a data-to="s-bg">🎬 Фон віджета</a>
    <a data-to="s-server">🔌 Сервер</a>
    <a data-to="s-punish">💀 Покарання</a>
    <a data-to="s-activity">🧑‍💻 Активність і git</a>
    <a data-to="s-notify">🔔 Сповіщення</a>
  </nav>

  <main id="main">
    <section id="s-widget">
      <h2>🪟 Віджет</h2>
      <div class="card">
        <div class="row"><label for="show_widget">Показувати віджет</label>
          <span class="switch"><input type="checkbox" id="show_widget"><i></i></span></div>
        <div class="row"><label>Де жити</label>
          <div class="seg">
            <label><input type="radio" name="widget_mode" value="desktop"><span>🖥 Під вікнами</span></label>
            <label><input type="radio" name="widget_mode" value="overlay"><span>🎮 Поверх усіх вікон</span></label>
          </div></div>
        <div class="row top-align"><label>Тема</label><div class="themes" id="themes"></div></div>
        <div class="row"><label for="widget_character">Персонаж<small>Чібі біля кнопки ✅, реагує на стан</small></label>
          <span class="switch"><input type="checkbox" id="widget_character"><i></i></span></div>
        <div class="row"><label for="widget_snap_px">Прилипання до країв<small>px, 0 = вимкнено</small></label>
          <input type="number" id="widget_snap_px" min="0" max="200" step="1"></div>
      </div>
    </section>

    <section id="s-bg">
      <h2>🎬 Фон віджета</h2>
      <div class="card" id="states"></div>
      <div class="card" style="margin-top:10px">
        <div class="row"><label for="widget_background_dim">Затемнення фону<small>Колір теми поверх, щоб текст читався</small></label>
          <div class="dim"><input type="range" id="widget_background_dim" min="0" max="1" step="0.05"><output id="dimOut"></output></div></div>
        <div class="row"><label>Свої файли</label>
          <div><button class="btn" id="openBgDir">📂 Відкрити папку фонів</button>
          <small>Поклади .webm / .webp / .jpg / .png у папку стану — і обирай тут</small></div></div>
      </div>
    </section>

    <section id="s-server">
      <h2>🔌 Сервер</h2>
      <div class="card">
        <div class="row"><label for="server_url">Адреса сервера</label><input type="text" id="server_url" placeholder="https://gachi.example.com" spellcheck="false"></div>
        <div class="row"><label for="token">Токен<small>Видає <code>gachi-server user add</code></small></label>
          <div class="with-btn"><input type="password" id="token" spellcheck="false" autocomplete="off"><button class="btn" id="showToken" title="Показати">👁</button></div></div>
        <div class="row"><label for="poll_seconds">Опитувати кожні<small>секунд, мінімум 10</small></label><input type="number" id="poll_seconds" min="10" step="5"></div>
      </div>
    </section>

    <section id="s-punish">
      <h2>💀 Покарання</h2>
      <div class="card">
        <div class="row"><label for="warning_images_dir">Шпалери: попередження</label>
          <div class="with-btn"><input type="text" id="warning_images_dir" spellcheck="false"><button class="btn" data-open="warning_images_dir">📂</button></div></div>
        <div class="row"><label for="failed_images_dir">Шпалери: провал</label>
          <div class="with-btn"><input type="text" id="failed_images_dir" spellcheck="false"><button class="btn" data-open="failed_images_dir">📂</button></div></div>
        <div class="row"><label for="rotate_minutes">Міняти картинку кожні<small>хвилин, 0 = ніколи</small></label><input type="number" id="rotate_minutes" min="0" step="5"></div>
        <div class="row"><label for="warning_sound">Звук: попередження<small>Папка, файл або SystemExclamation</small></label>
          <div class="with-btn"><input type="text" id="warning_sound" spellcheck="false"><button class="btn" data-open="warning_sound">📂</button></div></div>
        <div class="row"><label for="failed_sound">Звук: провал</label>
          <div class="with-btn"><input type="text" id="failed_sound" spellcheck="false"><button class="btn" data-open="failed_sound">📂</button></div></div>
      </div>
    </section>

    <section id="s-activity">
      <h2>🧑‍💻 Активність і git</h2>
      <div class="card">
        <div class="row top-align"><label for="local_repos">Локальні репозиторії<small>По одному шляху на рядок. Коміт за сьогодні = зараховано</small></label>
          <textarea id="local_repos" spellcheck="false" placeholder="C:\code\go-diary"></textarea></div>
        <div class="row top-align"><label for="local_author_emails">Email авторів<small>Порожньо = user.email з репозиторію</small></label>
          <textarea id="local_author_emails" spellcheck="false"></textarea></div>
        <div class="row"><label for="activity_tracking">Рахувати час у програмах<small>Лише назви програм, без заголовків вікон</small></label>
          <span class="switch"><input type="checkbox" id="activity_tracking"><i></i></span></div>
        <div class="row"><label for="share_activity">Показувати партнеру<small>Поточна програма й статистика за день</small></label>
          <span class="switch"><input type="checkbox" id="share_activity"><i></i></span></div>
        <div class="row top-align"><label for="activity_ignore">Не відстежувати<small>Програми, по одній на рядок</small></label>
          <textarea id="activity_ignore" spellcheck="false" placeholder="Telegram.exe"></textarea></div>
      </div>
    </section>

    <section id="s-notify">
      <h2>🔔 Сповіщення</h2>
      <div class="card">
        <div class="row"><label for="achievement_notifications">Сповіщення про ачівки</label>
          <span class="switch"><input type="checkbox" id="achievement_notifications"><i></i></span></div>
      </div>
    </section>
  </main>
</div>

<div class="bar">
  <span class="msg" id="msg"></span>
  <button class="link" id="openCfg">config.json</button>
  <button class="btn" id="cancel">Закрити</button>
  <button class="btn primary" id="save" disabled>Зберегти</button>
</div>

<script>
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const STATES = [
    ["safe", "✅", "Зараховано"], ["pending", "⏳", "Ще нема активності"],
    ["warning", "⚠️", "≤ 5 год до дедлайну"], ["failed", "💀", "Провал"],
  ];
  const TEXT = ["server_url", "token", "warning_images_dir", "failed_images_dir", "warning_sound", "failed_sound"];
  const INT = ["poll_seconds", "widget_snap_px", "rotate_minutes"];
  const BOOL = ["show_widget", "widget_character", "activity_tracking", "share_activity", "achievement_notifications"];
  const LINES = ["local_repos", "local_author_emails", "activity_ignore"];

  let st, saved, bg = {}, library = [];

  // "01_pool_chill.webm" → "pool chill"
  const pretty = p => p.split(/[\\/]/).pop().replace(/\.[^.]+$/, "").replace(/^\d+[_-]/, "").replace(/[_-]+/g, " ");
  const same = (a, b) => (a || "").toLowerCase() === (b || "").toLowerCase();

  function collect() {
    const v = {};
    for (const k of TEXT) v[k] = $(k).value.trim();
    for (const k of INT) v[k] = Math.max(0, parseInt($(k).value, 10) || 0);
    for (const k of BOOL) v[k] = $(k).checked;
    for (const k of LINES) v[k] = $(k).value.split("\n").map(s => s.trim()).filter(Boolean);
    v.widget_mode = document.querySelector("input[name=widget_mode]:checked").value;
    v.widget_theme = document.querySelector("input[name=widget_theme]:checked").value;
    v.widget_background_dim = Math.round(parseFloat($("widget_background_dim").value) * 100) / 100;
    v.widget_background = { default: "", ...bg };
    return v;
  }
  function changed() {
    const now = collect(), out = {};
    for (const k in now) if (JSON.stringify(now[k]) !== JSON.stringify(saved[k])) out[k] = now[k];
    return out;
  }
  function refreshSave() {
    const n = Object.keys(changed()).length;
    $("save").disabled = !n;
    if (n) msg(`Незбережених змін: ${n}`);
    else if ($("msg").dataset.kind !== "ok") msg("");
  }
  function msg(text, kind) {
    const m = $("msg"); m.textContent = text; m.className = "msg" + (kind ? " " + kind : ""); m.dataset.kind = kind || "";
  }

  function fill(c) {
    for (const k of TEXT) $(k).value = c[k] || "";
    for (const k of INT) $(k).value = c[k] || 0;
    for (const k of BOOL) $(k).checked = !!c[k];
    for (const k of LINES) $(k).value = (c[k] || []).join("\n");
    document.querySelector(`input[name=widget_mode][value=${c.widget_mode}]`).checked = true;
    $("widget_background_dim").value = c.widget_background_dim;
    $("dimOut").value = Math.round(c.widget_background_dim * 100) + "%";
    renderThemes(c.widget_theme);
    for (const [s] of STATES) bg[s] = c.widget_background[s] || "";
    renderStates();
  }

  function renderThemes(cur) {
    const box = $("themes"); box.textContent = "";
    for (const t of st.themes) {
      const l = el("label", "theme" + (t.id === cur ? " on" : ""));
      l.dataset.theme = t.id; // the chip renders in its own colors
      const i = el("input"); i.type = "radio"; i.name = "widget_theme"; i.value = t.id; i.checked = t.id === cur;
      i.onchange = () => {
        document.documentElement.dataset.theme = t.id; // preview right here
        box.querySelectorAll(".theme").forEach(x => x.classList.toggle("on", x.dataset.theme === t.id));
        refreshSave();
      };
      l.append(i, el("span", "sw"), el("span", "", t.title));
      box.append(l);
    }
  }

  function tile(cap, preview, on, onClick) {
    const b = el("button", "tile" + (on ? " on" : "")); b.type = "button";
    const pv = el("span", "pv");
    if (typeof preview === "string") pv.textContent = preview; else pv.append(preview);
    b.append(pv, el("span", "cap", cap));
    b.onclick = onClick;
    if (b.querySelector("video")) {
      const v = b.querySelector("video");
      b.onmouseenter = () => v.play().catch(() => {});
      b.onmouseleave = () => { v.pause(); v.currentTime = 0; };
    }
    return b;
  }
  function mediaPreview(m) {
    if (!m.url) return "🎞";
    if (m.video) {
      const v = el("video"); v.src = m.url; v.muted = true; v.loop = true; v.preload = "metadata"; v.playsInline = true;
      return v;
    }
    const i = el("img"); i.src = m.url; i.alt = ""; i.loading = "lazy";
    return i;
  }

  function renderStates() {
    const box = $("states"); box.textContent = "";
    for (const [s, icon, title] of STATES) {
      const cur = bg[s], folder = st.folders[s];
      const row = el("div", "state");
      const head = el("div", "state-head");
      head.append(el("b", "", `${icon} ${s}`), el("span", "hint", title));
      const strip = el("div", "strip");
      const pick = v => () => { bg[s] = v; renderStates(); refreshSave(); };

      strip.append(tile("Випадковий", "🎲", same(cur, folder), pick(folder)));
      strip.append(tile("Без фону", "🚫", cur === "", pick("")));
      let known = same(cur, folder) || cur === "";
      for (const m of library) {
        const on = same(cur, m.path); known ||= on;
        const t = tile(pretty(m.path), mediaPreview(m), on, pick(m.path));
        t.title = m.path;
        strip.append(t);
      }
      if (!known) { // a folder or file set by hand outside the library
        const t = tile(pretty(cur), "📁", true, pick(cur)); t.title = cur; strip.append(t);
      }
      strip.append(tile("Свій файл…", "➕", false, async () => {
        const m = await window.gsPickBackground();
        if (!m) return;
        if (!library.some(x => same(x.path, m.path))) library.push(m);
        bg[s] = m.path; renderStates(); refreshSave();
      }));
      row.append(head, strip);
      box.append(row);
      const on = strip.querySelector(".on"); // keep the chosen one in sight
      const x = on ? on.offsetLeft - strip.offsetLeft : 0;
      if (on && x + on.offsetWidth > strip.clientWidth) strip.scrollLeft = x - 8;
    }
  }

  async function load() {
    st = await window.gsLoad();
    library = st.library || [];
    $("ver").textContent = st.version;
    fill(st.config);
    saved = collect();
    refreshSave();
  }

  async function save() {
    const diff = changed();
    if (!Object.keys(diff).length) return;
    $("save").disabled = true;
    try {
      const warn = await window.gsSave(diff);
      saved = collect();
      if (warn) msg(warn, "err"); else msg("✓ Збережено й застосовано", "ok");
    } catch (e) {
      msg("Не збережено: " + e, "err");
      $("save").disabled = false;
    }
  }

  // nav: click scrolls, scrolling highlights
  const links = [...document.querySelectorAll("nav a")];
  links.forEach(a => a.onclick = () => $(a.dataset.to).scrollIntoView());
  const spy = () => {
    let cur = links[0];
    for (const a of links) if ($(a.dataset.to).offsetTop - $("main").scrollTop < 120) cur = a;
    links.forEach(a => a.classList.toggle("on", a === cur));
  };
  $("main").addEventListener("scroll", spy); spy();

  document.addEventListener("input", e => {
    if (e.target.id === "widget_background_dim") $("dimOut").value = Math.round(e.target.value * 100) + "%";
    if (saved) refreshSave();
  });
  document.addEventListener("change", () => saved && refreshSave());
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    const p = $(b.dataset.open).value.trim(); if (p) window.gsOpen(p);
  });
  $("openBgDir").onclick = () => window.gsOpen(st.folders.safe.replace(/[\\/][^\\/]+$/, ""));
  $("openCfg").onclick = () => window.gsOpen(st.cfg_path);
  $("showToken").onclick = () => { const t = $("token"); t.type = t.type === "password" ? "text" : "password"; };
  $("save").onclick = save;
  $("cancel").onclick = () => {
    if (Object.keys(changed()).length && !confirm("Є незбережені зміни. Закрити без збереження?")) return;
    window.gsClose();
  };
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  });
  load().catch(e => msg("Не вдалося завантажити налаштування: " + e, "err"));
</script>
</body>
</html>
