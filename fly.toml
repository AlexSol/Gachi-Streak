# Fly.io config for gachi-server. Change `app` to a unique name before the
# first deploy (or run `fly launch --no-deploy --copy-config`).
app = "gachi-streak"
primary_region = "ams" # latency doesn't matter here; "iad" is a bit cheaper

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  GACHI_DB = "/data/gachi.db"
  GACHI_ADDR = ":8080"

# SQLite lives on a persistent volume: fly volumes create gachi_data --size 1
[[mounts]]
  source = "gachi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The deadline worker must run around the clock — never stop the machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
