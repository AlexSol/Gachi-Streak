# fly.toml app configuration file generated for gachi-streak on 2026-10-19T16:22:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gachi-streak'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  GACHI_ADDR = ':8080'
  GACHI_DB = '/data/gachi.db'

[[mounts]]
  source = 'gachi_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
